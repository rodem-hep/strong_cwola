_target_: src.models.classifier.Classifier

embed_config:
  hddn_dim: 64
  num_blocks: 2
  norm: LayerNorm
  act_o: SiLU
  act_h: SiLU
  norm_on_output: True

encoder_config:
  dim: 128
  ctxt_dim: 32
  num_layers: 6
  num_registers: 8

ca_config:
  dim: 128
  num_layers: 2

optimizer:
  _target_: mltools.mltools.optimisers.AdamWS
  _partial_: True
  lr: 5.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1

scheduler:
  _target_: mltools.mltools.lightning_utils.linear_warmup_cosine_decay
  _partial_: True
  warmup_steps: 10_000
  total_steps: -1
