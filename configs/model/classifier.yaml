_target_: src.models.classifier.Classifier
backbone_path: null

embed_config:
  hddn_dim: 64
  num_blocks: 1
  norm: LayerNorm
  act_o: SiLU
  act_h: SiLU
  norm_on_output: True
  dropout: 0.3

encoder_config:
  dim: 128
  ctxt_dim: 32
  num_layers: 3
  num_registers: 4
  pack_inputs: True
  layer_config:
    ff_config:
      dropout: 0.3
    attn_config:
      dropout: 0.3

ca_config:
  dim: 64
  num_layers: 2

optimizer:
  _target_: mltools.mltools.optimisers.AdamWS
  _partial_: True
  lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1

scheduler:
  _target_: mltools.mltools.lightning_utils.linear_warmup_cosine_decay
  _partial_: True
  warmup_steps: 1000
  total_steps: -1
